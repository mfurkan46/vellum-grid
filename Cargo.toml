[workspace]
members = ["crates/core", "crates/io", "crates/cli", "crates/ui", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Vellum contributors"]
repository = "https://github.com/mfurkan46/vellum-grid"
homepage = "https://github.com/mfurkan46/vellum-grid"

[workspace.dependencies]
vellum-grid-core = { path = "crates/core" }
vellum-grid-io = { path = "crates/io" }
vellum-ui = { path = "crates/ui" }
csv = "1.3"
calamine = "0.36"
rust_xlsxwriter = "0.100"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png"] }
pdf-writer = "0.15"
subsetter = "0.2.6"
spellbook = "0.4.2"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

[profile.dev.package.spellbook]
opt-level = 3

[profile.release]
strip = true
